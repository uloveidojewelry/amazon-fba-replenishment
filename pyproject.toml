[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "amazon-fba-replenishment"
version = "0.1.0"
description = "Read-only FBA replenishment planning with family-wide stop rules"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1", "requests>=2.31"]
[project.optional-dependencies]
dev = ["pytest>=8"]
[project.scripts]
fba-plan = "fba_replenishment.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
